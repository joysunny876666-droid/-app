<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>英單大挑戰 - 專業單字檢測系統</title>
    <meta name="description" content="提供英單填空與選擇題測試，追蹤學習進度，查看200個精選單字。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
</head>
<body>
    <div id="app" class="app-container">
        <!-- Navigation -->
        <nav class="glass-nav">
            <div class="logo" id="btn-home">VocabMaster</div>
            <div class="nav-links">
                <button class="nav-btn" id="btn-vocab-list">單字庫</button>
                <button class="nav-btn" id="btn-history">歷史紀錄</button>
            </div>
        </nav>

        <main class="content">
            <!-- Home Screen -->
            <section id="screen-home" class="screen active">
                <div class="hero-section">
                    <h1>提升你的英語實力</h1>
                    <p>選擇難度並開始測驗，追蹤你的進步軌跡。</p>
                </div>
                
                <div class="settings-card glass">
                    <h2>測驗設定</h2>
                    <div class="setting-group">
                        <label for="difficulty-select">難度範圍</label>
                        <select id="difficulty-select">
                            <option value="全部">全部</option>
                            <option value="初階">初階</option>
                            <option value="中階">中階</option>
                            <option value="進階">進階</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="count-select">題目數量</label>
                        <select id="count-select">
                            <option value="10">10 題</option>
                            <option value="20">20 題</option>
                            <option value="50">50 題</option>
                            <option value="100">100 題</option>
                        </select>
                    </div>
                    <div class="setting-group">
                        <label for="mode-select">測驗模式</label>
                        <select id="mode-select">
                            <option value="mixed">混合模式 (選擇+填空)</option>
                            <option value="choice">純選擇題</option>
                            <option value="input">純填空題</option>
                        </select>
                    </div>
                    <button id="btn-start-quiz" class="primary-btn">開始測驗</button>
                </div>
            </section>

            <!-- Quiz Screen -->
            <section id="screen-quiz" class="screen">
                <div class="quiz-header">
                    <div class="progress-container">
                        <div class="progress-bar" id="quiz-progress"></div>
                    </div>
                    <div class="quiz-info">
                        <span id="question-number">第 1 / 10 題</span>
                        <span id="current-difficulty">難度：初階</span>
                    </div>
                </div>

                <div class="question-card glass">
                    <div class="question-type" id="question-type-label">選擇題</div>
                    <h3 id="question-text">Translation here...</h3>
                    
                    <!-- Multiple Choice Container -->
                    <div id="choice-container" class="options-grid">
                        <!-- Options generated by JS -->
                    </div>

                    <!-- Input Container -->
                    <div id="input-container" class="input-area hidden">
                        <input type="text" id="quiz-input" placeholder="輸入英文單字..." autocomplete="off">
                        <button id="btn-submit-input" class="secondary-btn">送出答案</button>
                    </div>
                    
                    <div id="feedback" class="feedback hidden">
                        <p id="feedback-msg"></p>
                        <button id="btn-next-question" class="primary-btn">下一題</button>
                    </div>
                </div>
            </section>

            <!-- Result Screen -->
            <section id="screen-result" class="screen">
                <div class="result-card glass">
                    <div class="result-icon">🏆</div>
                    <h2>測驗完成！</h2>
                    <div class="score-display">
                        <span id="final-score">80</span>
                        <span class="total-score">/ 100 分</span>
                    </div>
                    <p id="result-message">做得好！繼續努力！</p>
                    <div class="result-stats">
                        <div class="stat-item">
                            <span class="label">答對題數</span>
                            <span class="value" id="correct-count">8</span>
                        </div>
                        <div class="stat-item">
                            <span class="label">總題數</span>
                            <span class="value" id="total-count">10</span>
                        </div>
                    </div>
                    <div class="result-actions">
                        <button id="btn-restart" class="primary-btn">再測一次</button>
                        <button id="btn-back-home" class="secondary-btn">回首頁</button>
                    </div>
                </div>
            </section>

            <!-- History Screen -->
            <section id="screen-history" class="screen">
                <div class="header-with-action">
                    <h2>歷史測驗紀錄</h2>
                    <button id="btn-clear-history" class="text-btn">清除紀錄</button>
                </div>
                <div id="history-container" class="history-list">
                    <!-- History items generated by JS -->
                </div>
            </section>

            <!-- Vocab List Screen -->
            <section id="screen-vocab" class="screen">
                <div class="header-with-action">
                    <h2>單字庫 (200)</h2>
                    <div class="search-box">
                        <input type="text" id="vocab-search" placeholder="搜尋單字或翻譯...">
                    </div>
                </div>
                <div class="vocab-filters">
                    <button class="filter-btn active" data-filter="全部">全部</button>
                    <button class="filter-btn" data-filter="初階">初階</button>
                    <button class="filter-btn" data-filter="中階">中階</button>
                    <button class="filter-btn" data-filter="進階">進階</button>
                </div>
                <div id="vocab-container" class="vocab-grid">
                    <!-- Vocab items generated by JS -->
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
